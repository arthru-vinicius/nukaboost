# Config do nginx para a imagem de distribuição pública do NukaBoost.
#
# Contrato com o lado do homelab (ver tmp/solicitacao.txt e o relatório de
# resposta): só GET/HEAD são aceitos (405 em qualquer outro método); rotas
# fora das três abaixo devem devolver 404; `/` serve o instalador como
# `text/plain; charset=utf-8` com `Cache-Control: no-store` (essencial atrás
# do Cloudflare -- um content-type errado faz `irm | iex` executar HTML de
# login em vez do script); `/healthz` é o que o `homelab update` usa para
# confirmar que o container subiu depois de trocar a tag.
#
# Sem volume, sem arquivo de configuração montado em runtime -- tudo
# embutido na imagem (ver Dockerfile). Caminhos de log e temporários abaixo
# apontam para /tmp de propósito: o container roda com filesystem raiz
# somente leitura, e /tmp é o único ponto que precisa de um tmpfs no
# docker-compose do homelab.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # Único ponto de checagem de método: aplica-se a toda rota deste
        # server block, incluindo /healthz e as fora das location abaixo.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /install.ps1 =404;
            default_type "text/plain; charset=utf-8";
            add_header Cache-Control "no-store" always;
        }

        location = /NukaBoost.msi {
            try_files /NukaBoost.msi =404;
            default_type application/octet-stream;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }
}
